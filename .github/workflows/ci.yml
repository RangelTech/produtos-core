name: CI
# Testes da biblioteca no SQLite e num Postgres de verdade (spec 57 §0B): a mesma bateria da VPS.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: produtos_teste
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U teste" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q . pytest httpx fastapi itsdangerous python-multipart
      - name: Testes (SQLite e Postgres)
        env:
          PRODUTOS_DATABASE_URL: postgresql://teste:teste@localhost:5432/produtos_teste
        run: python -m pytest -q
