[project]
name = "produtos-core"
version = "0.1.6"
description = "Biblioteca compartilhada dos produtos Rangel Tech: banco Postgres compatível com o SQLite dos produtos, migração e (próximas versões) identidade, login e armazenamento S3."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["produtos_core"]
